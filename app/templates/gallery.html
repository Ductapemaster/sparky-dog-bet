{% extends "base.html" %}
{% block content %}
<h2 class="section-title">Sparky's Photos</h2>
<p class="muted" style="margin-bottom:1.25rem;">Study him carefully. Every clue counts.</p>

{% if images %}
<div class="gallery-grid">
  {% for img in images %}
  <div class="gallery-item">
    <img src="{{ url_for('main.gallery_thumb', filename=img.filename) }}"
         data-full="{{ url_for('main.gallery_img', filename=img.filename) }}"
         alt="Sparky" loading="lazy"
         class="gallery-thumb">
  </div>
  {% endfor %}
</div>
{% else %}
<div class="alert alert-info">No photos have been added yet. Check back soon!</div>
{% endif %}

{# ── Lightbox ── #}
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">&times;</button>
  <div id="lb-inner">
    <button id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button id="lb-next" aria-label="Next photo">&#8250;</button>
  </div>
</div>


<script>
  var lb      = document.getElementById('lightbox');
  var lbImg   = document.getElementById('lb-img');
  var lbClose = document.getElementById('lb-close');
  var lbPrev  = document.getElementById('lb-prev');
  var lbNext  = document.getElementById('lb-next');

  var thumbs = Array.from(document.querySelectorAll('.gallery-thumb'));
  var currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    var img = thumbs[currentIndex];
    lbImg.src = img.dataset.full;
    lbImg.alt = img.alt;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  thumbs.forEach(function (img, i) {
    img.addEventListener('click', function () { openLightbox(i); });
  });

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + thumbs.length) % thumbs.length;
    lbImg.src = thumbs[currentIndex].dataset.full;
    lbImg.alt = thumbs[currentIndex].alt;
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % thumbs.length;
    lbImg.src = thumbs[currentIndex].dataset.full;
    lbImg.alt = thumbs[currentIndex].alt;
  }

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', function (e) { e.stopPropagation(); showPrev(); });
  lbNext.addEventListener('click', function (e) { e.stopPropagation(); showNext(); });

  lb.addEventListener('click', function (e) {
    if (e.target === lb) closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  showPrev();
    if (e.key === 'ArrowRight') showNext();
  });

  var swipeStartX = null;
  var swipeStartY = null;

  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, { passive: true });

  lb.addEventListener('touchend', function (e) {
    if (swipeStartX === null) return;
    var dx = e.changedTouches[0].clientX - swipeStartX;
    var dy = e.changedTouches[0].clientY - swipeStartY;
    swipeStartX = null;
    swipeStartY = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) showNext(); else showPrev();
  }, { passive: true });
</script>
{% endblock %}
