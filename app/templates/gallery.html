{% extends "base.html" %}
{% block content %}
<h2 class="section-title">Sparky's Photos</h2>
<p class="muted" style="margin-bottom:1.25rem;">Study him carefully. Every clue counts.</p>

{% if images %}
<div class="gallery-grid">
  {% for img in images %}
  <div class="gallery-item">
    <img src="{{ url_for('main.gallery_thumb', filename=img.filename) }}"
         data-full="{{ url_for('main.gallery_img', filename=img.filename) }}"
         alt="Sparky" loading="lazy"
         class="gallery-thumb">
  </div>
  {% endfor %}
</div>
{% else %}
<div class="alert alert-info">No photos have been added yet. Check back soon!</div>
{% endif %}

{# ── Lightbox ── #}
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">&times;</button>
  <img id="lb-img" src="" alt="">
</div>

<style>
  .gallery-thumb { cursor: zoom-in; }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #lightbox.open { display: flex; }

  #lb-img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  #lb-close {
    position: fixed;
    top: 1rem;
    right: 1.25rem;
    background: none;
    border: none;
    color: #fff;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0.7;
    padding: 0.25rem 0.5rem;
  }
  #lb-close:hover { opacity: 1; }
</style>

<script>
  var lb      = document.getElementById('lightbox');
  var lbImg   = document.getElementById('lb-img');
  var lbClose = document.getElementById('lb-close');

  document.querySelectorAll('.gallery-thumb').forEach(function (img) {
    img.addEventListener('click', function () {
      lbImg.src = img.dataset.full;
      lbImg.alt = img.alt;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
  }

  lbClose.addEventListener('click', closeLightbox);
  lb.addEventListener('click', function (e) {
    if (e.target === lb) closeLightbox();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>
{% endblock %}
