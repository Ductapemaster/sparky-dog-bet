{% extends "base.html" %}
{% block content %}
<h2 class="section-title" style="margin-bottom:1.25rem;">Sparky's Photos</h2>

{% if images %}
<div class="gallery-grid">
  {% for img in images %}
  <div class="gallery-item">
    <img src="{{ url_for('main.gallery_thumb', filename=img.filename) }}"
         data-full="{{ url_for('main.gallery_img', filename=img.filename) }}"
         alt="Sparky" loading="lazy"
         class="gallery-thumb">
  </div>
  {% endfor %}
</div>
{% else %}
<div class="alert alert-info">No photos have been added yet. Check back soon!</div>
{% endif %}

{% include '_lightbox.html' %}
{% endblock %}
